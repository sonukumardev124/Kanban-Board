<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <nav>
            <div class="left">Kanban</div>
            <div class="right">
                <button id="toggle-modal">Add new Task</button>
            </div>
        </nav>
        <section class="board">

            <!-- TODO COLUMN -->

            <div id="todo" class="task-column">
                <div class="heading">
                    <div class="left">To Do</div>
                    <div class="right">Count</div>
                </div>
                <div class="tasks-container">
                    <div draggable="true" class="task">
                        <h2>Task 1</h2>
                        <p>Description for Task 1</p>
                        <button>Delete</button>
                    </div>
                </div>
            </div> 

            <!--  PROGRESS COLUMN — todo ke bahar -->
            <div id="progress" class="task-column">
                <div class="heading">
                    <div class="left">In Progress</div>
                    <div class="right">Count</div>
                </div>
                <div class="tasks-container"></div> 
            </div>

            <!-- DONE COLUMN — todo ke bahar -->
            <div id="done" class="task-column">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right">Count</div>
                </div>
                <div class="tasks-container"></div>
            </div>

        </section>
        <footer></footer>  <!-- footer add -->
    </main>

    <!-- Modal use -->
    <div class="modal add-new-task">
        <div class="bg"></div>
        <div class="center">
            <input type="text" id="task-title-input" placeholder="Task Title">
            <textarea id="task-desc-input" placeholder="Text Description"></textarea>
            <button id="add-new-task" class="add-task-btn">Add Task</button>
        </div>
    </div>
</body>

</html>
